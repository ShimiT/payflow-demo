# Buggy Configuration - For incident simulation
backend:
  resources:
    limits:
      memory: "512Mi"

config:
  cacheMaxSize: "128MB"
  cacheTTL: "7200"
  dbPoolSize: "25"
  rateLimitRPS: "1000"
  logLevel: "debug"
  featureNewCache: "true"    # Buggy feature

bugInjection:
  enabled: true
  oom: false
  latencyMs: 0
  errorRate: 0
  cpuBurn: false
  panic: false
  dbTimeout: false
