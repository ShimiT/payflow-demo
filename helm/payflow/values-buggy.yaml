# Buggy Configuration - For incident simulation
backend:
  resources:
    limits:
      memory: "512Mi"  # Adjusted to prevent OOM

config:
   cacheMaxSize: "50MB"       # Reduced to prevent OOM
  cacheTTL: "7200"
  dbPoolSize: "25"
  rateLimitRPS: "1000"
  logLevel: "debug"
  featureNewCache: "true"    # Buggy feature

  15 | bugInjection:
  16 |   enabled: false
  17 |   oom: false
  18 |   latencyMs: 0
  errorRate: 0
  cpuBurn: false
  panic: false
  dbTimeout: false
